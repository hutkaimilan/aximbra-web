<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0b0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Milán Trader</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0f14;--card:#121821;--line:#1e2833;--tx:#eef2f6;--mut:#8b97a5;--up:#1fbf7a;--dn:#ef4b55;--acc:#3b82f6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:640px;margin:0 auto;padding:14px 16px calc(84px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:10;background:rgba(11,15,20,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 10px) 16px 10px}
.top .in{max-width:640px;margin:0 auto;display:flex;align-items:center;justify-content:space-between}
.top b{font-weight:700;letter-spacing:.02em}.live{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mut)}.dot.on{background:var(--up)}.dot.off{background:var(--dn)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.lbl{font-size:13px;color:var(--mut)}.big{font-size:36px;font-weight:700;letter-spacing:-.02em;margin:2px 0}.mid{font-size:24px;font-weight:700;margin:2px 0}
.up{color:var(--up)}.dn{color:var(--dn)}.mut{color:var(--mut)}.sm{font-size:13px}
.acct{display:flex;align-items:center;justify-content:space-between;gap:12px}
.btns{display:flex;gap:8px;margin-top:12px}
button{font:600 15px Inter;border-radius:12px;border:1px solid var(--line);background:#1a222d;color:var(--tx);padding:12px 14px;cursor:pointer}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}.btns button{flex:1}
button:disabled{opacity:.5}
input{font:inherit;width:100%;color:var(--tx);background:#0e141b;border:1px solid var(--line);border-radius:12px;padding:14px;outline:none}input:focus{border-color:var(--acc)}
.banner{background:rgba(239,75,85,.1);border:1px solid rgba(239,75,85,.35);color:#ffb3b8;border-radius:12px;padding:12px;margin-bottom:12px;font-size:14px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}
.row .t{font-weight:600}.row .s{font-size:12.5px;color:var(--mut);margin-top:2px}.row .r{text-align:right;white-space:nowrap}
h3{font-size:14px;color:var(--mut);font-weight:600;margin:0 0 6px}
.empty{color:var(--mut);font-size:14px;padding:6px 0}
nav{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;background:rgba(11,15,20,.95);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;border:0;background:none;color:var(--mut);font:600 13px Inter;padding:10px 0}nav button.on{color:var(--tx)}
.view{display:none}.view.on{display:block}
.modal{position:fixed;inset:0;z-index:20;display:none;background:rgba(0,0,0,.6);align-items:flex-end;justify-content:center}.modal.on{display:flex}
.modal .in{width:100%;max-width:640px;background:var(--card);border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom))}
.err{color:#ffb3b8;font-size:13px;min-height:18px;margin-top:8px}
.link{background:none;border:0;color:var(--acc);padding:0;font-size:13px}
.msgs{display:flex;flex-direction:column;gap:8px;min-height:50vh}
.msg{max-width:85%;padding:10px 12px;border-radius:14px;white-space:pre-wrap;font-size:14px}.msg.user{align-self:flex-end;background:var(--acc);color:#fff}.msg.bot{align-self:flex-start;background:var(--card);border:1px solid var(--line)}
form.send{display:flex;gap:8px;margin-top:12px}
#login{max-width:420px;margin:18vh auto 0;padding:0 16px}
</style>
</head>
<body>
<div id="login">
  <h2 style="margin:0 0 14px">Milán Trader</h2>
  <form id="lf" style="display:flex;gap:8px"><input id="pw" type="password" placeholder="Jelszó" autocomplete="current-password"><button class="pri">Belépés</button></form>
  <div id="le" class="err"></div>
  <div class="mut sm" style="margin-top:12px">Vagy nyisd meg a titkos belépési linket ezen az eszközön.</div>
</div>

<div id="app" style="display:none">
<div class="top"><div class="in"><b>Milán Trader</b><span class="live"><i class="dot" id="dot"></i><span id="liveTx">–</span></span></div></div>
<main>
  <section class="view on" id="v-home">
    <div id="banner"></div>
    <div class="card">
      <div class="lbl">Teljes egyenleg</div>
      <div class="big" id="total">–</div>
      <div class="sm" id="totalPnl"></div>
    </div>
    <div class="card">
      <div class="acct"><div><div class="lbl">👛 Tárca · szabad pénz</div><div class="mid" id="walletBal">–</div></div></div>
      <div class="mut sm">Innen teszel pénzt a számlákra, és ide veszed ki.</div>
      <div class="btns" id="retBox" style="display:none"><button id="ret">Mind vissza a számlákra</button></div>
    </div>
    <div id="accounts"></div>
    <div class="card"><h3>Értesítések</h3><div id="events"><div class="empty">Betöltés…</div></div></div>
  </section>

  <section class="view" id="v-pos"><div id="positions"></div></section>

  <section class="view" id="v-chat">
    <div class="msgs" id="msgs"></div>
    <form class="send" id="sf"><input id="tx" placeholder="Kérdezd a botot…" autocomplete="off"><button class="pri">Küld</button></form>
  </section>
</main>
<nav>
  <button data-v="v-home" class="on">Áttekintés</button>
  <button data-v="v-pos">Pozíciók</button>
  <button data-v="v-chat">Chat</button>
</nav>
</div>

<div class="modal" id="modal"><div class="in">
  <h2 style="margin:0 0 4px;font-size:20px" id="mTitle">–</h2>
  <div class="mut sm" id="mHint">–</div>
  <div style="margin-top:14px"><input id="mAmt" type="number" min="0" step="any" inputmode="decimal" placeholder="Összeg ($)"></div>
  <div style="margin-top:8px"><button class="link" id="mMax" type="button">Mind</button></div>
  <div class="err" id="mErr"></div>
  <div class="btns"><button id="mNo" type="button">Mégse</button><button class="pri" id="mOk" type="button">Rendben</button></div>
</div></div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const usd=(n,d=0)=>n==null||isNaN(n)?'–':Number(n).toLocaleString('hu-HU',{minimumFractionDigits:d,maximumFractionDigits:d})+' $';
const signed=(n,d=0)=>n==null?'':`<span class="${n>=0?'up':'dn'}">${n>=0?'+':'−'}${usd(Math.abs(n),d)}</span>`;
const when=t=>{if(!t)return'';const d=new Date(t+(/Z|[+-]\d\d:?\d\d$/.test(t)?'':'Z'));return d.toLocaleString('hu-HU',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})};
let S=null,EV=[],lastId=0,M=null;

async function api(p,o){const r=await fetch(p,{credentials:'same-origin',...o});if(r.status===401){showLogin();throw 0}
 if(!r.ok){let m='';try{m=(await r.json()).detail}catch{}throw new Error(typeof m==='string'&&m?m:'Hiba ('+r.status+')')}return r.json()}
const post=(p,b)=>api(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
function showLogin(){$('#app').style.display='none';$('#login').style.display='block'}
$('#lf').onsubmit=async e=>{e.preventDefault();try{await post('/api/login',{password:$('#pw').value});boot()}catch(x){if(x!==0)$('#le').textContent=x.message}};
$$('nav button').forEach(b=>b.onclick=()=>{$$('nav button').forEach(x=>x.classList.toggle('on',x===b));$$('.view').forEach(v=>v.classList.toggle('on',v.id===b.dataset.v));
 if(b.dataset.v==='v-chat')setTimeout(()=>scrollTo(0,1e9),50);else scrollTo(0,0)});

// A két számla: a kripto (main) és a részvény/világpiaci (books[0]).
function accounts(){if(!S)return[];const a=[{key:'crypto',name:'₿ Kripto számla',...S.main}];
 const w=(S.books||[])[0];if(w&&!w.error)a.push({key:'world',name:'📈 Részvény és világpiac',...w});return a}

function render(){const A=accounts();if(!A.length)return;const wal=S.wallet||0;
 const total=wal+A.reduce((s,a)=>s+a.equity,0),pnl=A.reduce((s,a)=>s+a.equity-a.start,0);
 $('#total').textContent=usd(total);$('#totalPnl').innerHTML=`Eredmény eddig: ${signed(pnl)}`;
 $('#walletBal').textContent=usd(wal,2);$('#retBox').style.display=wal>=0.01?'flex':'none';
 const ok=S.last_tick_age!=null&&S.last_tick_age<300;$('#dot').className='dot '+(ok?'on':'off');$('#liveTx').textContent=ok?'A bot figyel':'A bot nem válaszol';
 $('#banner').innerHTML=A.filter(a=>a.paused).map(a=>`<div class="banner">🛑 ${esc(a.name)}: védekező mód — ${esc(a.paused)}. Feloldás a Chatben: /folytat</div>`).join('');
 $('#accounts').innerHTML=A.map(a=>{const p=a.equity-a.start;return `<div class="card">
  <div class="lbl">${esc(a.name)}</div><div class="mid">${usd(a.equity)}</div>
  <div class="sm">${signed(p)} eredmény · ${a.positions.length} nyitott pozíció · szabad: ${usd(a.cash)}</div>
  <div class="btns"><button data-acc="${a.key}" data-dir="in">+ Betesz</button><button data-acc="${a.key}" data-dir="out">− Kivesz</button></div></div>`}).join('');
 $$('#accounts button').forEach(b=>b.onclick=()=>openModal(b.dataset.acc,b.dataset.dir));
 $('#positions').innerHTML=A.map(a=>`<div class="card"><h3>${esc(a.name)}</h3>${a.positions.length?a.positions.map(p=>`<div class="row">
   <div><div class="t">${esc(p.symbol)}${p.side===-1?' · esésre':''}</div><div class="s">belépés ${p.entry.toPrecision(5)} · most ${p.price?p.price.toPrecision(5):'–'} · védőszint ${p.stop.toPrecision(5)}</div></div>
   <div class="r"><div>${usd(p.value||p.entry_value)}</div><div class="sm">${signed(p.pnl,2)}</div></div></div>`).join(''):'<div class="empty">Nincs nyitott pozíció.</div>'}</div>`).join('')}

function openModal(acc,dir){const a=accounts().find(x=>x.key===acc);if(!a)return;
 const max=dir==='in'?(S.wallet||0):a.cash;M={acc,dir,max};
 $('#mTitle').textContent=dir==='in'?`Betesz: ${a.name}`:`Kivesz: ${a.name}`;
 $('#mHint').textContent=dir==='in'?`A tárcából kerül át. Szabad a tárcában: ${usd(max,2)}`:`A tárcába kerül. A számlán szabad (nem pozícióban): ${usd(max,2)}`;
 $('#mAmt').value='';$('#mErr').textContent='';$('#mOk').disabled=false;$('#modal').classList.add('on');setTimeout(()=>$('#mAmt').focus(),50)}
$('#mMax').onclick=()=>{if(M)$('#mAmt').value=Math.floor(M.max*100)/100};
$('#mNo').onclick=()=>$('#modal').classList.remove('on');
$('#modal').onclick=e=>{if(e.target.id==='modal')$('#modal').classList.remove('on')};
$('#mOk').onclick=async()=>{const amount=parseFloat($('#mAmt').value);if(!(amount>0)){$('#mErr').textContent='Írj be egy összeget.';return}
 $('#mOk').disabled=true;try{await post('/api/transfer',{account:M.acc,direction:M.dir,amount});$('#modal').classList.remove('on');await poll()}
 catch(e){if(e!==0)$('#mErr').textContent=e.message;$('#mOk').disabled=false}};

$('#ret').onclick=async()=>{$('#ret').disabled=true;try{await post('/api/transfer/return',{});await poll()}catch(e){if(e!==0)alert(e.message)}$('#ret').disabled=false};
const LOUD=['trade','riskoff','wallet','move'];
function renderEvents(){const xs=EV.filter(e=>LOUD.includes(e.kind)).slice(-10).reverse();
 $('#events').innerHTML=xs.map(e=>`<div class="row"><div><div class="t">${esc(e.title)}</div>${e.body?`<div class="s">${esc(e.body).slice(0,220)}</div>`:''}</div><div class="r mut sm">${when(e.created_at)}</div></div>`).join('')||'<div class="empty">Még nincs értesítés.</div>'}
async function pollEvents(){const r=await api('/api/events?after='+lastId);for(const e of r.events){lastId=Math.max(lastId,e.id);EV.push(e)}EV=EV.slice(-200);renderEvents()}
async function poll(){S=await api('/api/state');render()}

function addMsg(c,t){const d=document.createElement('div');d.className='msg '+c;d.textContent=t;$('#msgs').appendChild(d);scrollTo(0,1e9);return d}
async function loadChat(){const r=await api('/api/chat');$('#msgs').innerHTML='';r.messages.forEach(m=>addMsg(m.role==='user'?'user':'bot',m.content))}
async function send(text){if(!text.trim())return;addMsg('user',text);const w=addMsg('bot','…');
 try{const r=await post('/api/chat',{text});w.textContent=r.reply;if(r.pending)waitReply(w)}catch(e){if(e!==0)w.textContent='Nem sikerült elküldeni. Próbáld újra.'}}
async function waitReply(w){const before=(await api('/api/chat')).messages.length;for(let i=0;i<20;i++){await new Promise(r=>setTimeout(r,10000));
 try{const m=(await api('/api/chat')).messages,l=m[m.length-1];if(m.length>before&&l&&l.role==='assistant'){w.textContent=l.content;return}}catch{}}}
$('#sf').onsubmit=e=>{e.preventDefault();const v=$('#tx').value;$('#tx').value='';send(v)};

let timers=[];
async function boot(){timers.forEach(clearInterval);try{await poll();$('#login').style.display='none';$('#app').style.display='block';
 await Promise.all([pollEvents(),loadChat()]);timers=[setInterval(()=>poll().catch(()=>{}),10000),setInterval(()=>pollEvents().catch(()=>{}),15000)]}
 catch(e){if(e!==0)$('#le').textContent=e.message||''}}
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
boot();
</script>
</body>
</html>
