<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@500;700&display=block">
<style>
/* A videós agent sablonja. Minden mozgás CSS-animáció; a renderelő a Web
   Animations API-val képkockánként állítja az időt, így ugyanaz a
   forgatókönyv mindig ugyanazt a videót adja. Három képarány (álló,
   négyzet, fekvő) és négy téma. */
:root{--sans:"Space Grotesk","DejaVu Sans",Arial,sans-serif;--mono:"JetBrains Mono","DejaVu Sans Mono",monospace;
  --W:540px;--H:960px;--hs:50px;--ss:22px;--ls:20px;--pad:36px}
body[data-theme=neon]{--bg:#03040a;--ink:#eef4ff;--mute:#94a3c4;--c:#00e5ff;--v:#8b5cff;--m:#ff3df2;--ok:#19f5a0;--bad:#ff4d6d;
  --card:rgba(16,22,40,.72);--cline:rgba(120,180,255,.18);--g1:rgba(0,229,255,.28);--g2:rgba(139,92,255,.30);--g3:rgba(255,61,242,.18);--gridc:rgba(120,180,255,.09)}
body[data-theme=clean]{--bg:#f4f7fc;--ink:#0d1526;--mute:#51607c;--c:#0a66ff;--v:#5b3df5;--m:#00a3c4;--ok:#0f9d58;--bad:#e5484d;
  --card:rgba(255,255,255,.9);--cline:rgba(13,21,38,.1);--g1:rgba(10,102,255,.14);--g2:rgba(91,61,245,.12);--g3:rgba(0,163,196,.10);--gridc:rgba(13,21,38,.05)}
body[data-theme=warm]{--bg:#0e0806;--ink:#fff3ea;--mute:#c7a89a;--c:#ffb020;--v:#ff5e3a;--m:#ff2d75;--ok:#7ee081;--bad:#ff4d6d;
  --card:rgba(40,22,16,.72);--cline:rgba(255,176,32,.2);--g1:rgba(255,176,32,.25);--g2:rgba(255,94,58,.25);--g3:rgba(255,45,117,.16);--gridc:rgba(255,176,32,.07)}
body[data-theme=mono]{--bg:#050505;--ink:#f5f5f5;--mute:#9a9a9a;--c:#ffffff;--v:#d4ff3a;--m:#d4ff3a;--ok:#d4ff3a;--bad:#ff4d4d;
  --card:rgba(30,30,30,.8);--cline:rgba(255,255,255,.14);--g1:rgba(255,255,255,.08);--g2:rgba(212,255,58,.12);--g3:rgba(255,255,255,.05);--gridc:rgba(255,255,255,.05)}
body.square{--W:540px;--H:540px;--hs:40px;--ss:18px;--ls:17px;--pad:30px}
body.land{--W:960px;--H:540px;--hs:46px;--ss:20px;--ls:18px;--pad:48px}
body.tall{--W:540px;--H:675px;--hs:44px;--ss:20px;--ls:18px;--pad:32px}
/* Álló képen nincs videós kísérő: se lejátszási csík, se felirat. */
body.stills .progress,body.stills .caption{display:none}
body.stills .scene{padding-bottom:64px}
body{--grad:linear-gradient(120deg,var(--c),var(--v) 55%,var(--m))}
*{box-sizing:border-box;margin:0}
html,body{width:var(--W);height:var(--H);overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--sans)}
#stage{position:relative;width:var(--W);height:var(--H);overflow:hidden;background:var(--bg)}
.bg{position:absolute;inset:-40px;background:radial-gradient(60% 45% at 10% 0%,var(--g1),transparent 70%),
  radial-gradient(65% 50% at 100% 45%,var(--g2),transparent 70%),radial-gradient(60% 45% at 30% 110%,var(--g3),transparent 70%);
  animation:glow var(--total) linear both}
@keyframes glow{to{transform:translate(-30px,20px) scale(1.08);filter:hue-rotate(25deg)}}
.grid{position:absolute;inset:0;background-image:linear-gradient(var(--gridc) 1px,transparent 1px),linear-gradient(90deg,var(--gridc) 1px,transparent 1px);
  background-size:36px 36px;mask-image:linear-gradient(180deg,transparent,#000 30%,#000 70%,transparent);animation:gridmove var(--total) linear both}
@keyframes gridmove{to{background-position:0 360px}}
.brand{position:absolute;top:28px;left:var(--pad);right:var(--pad);display:flex;justify-content:space-between;align-items:center;z-index:5;font:700 15px var(--sans);letter-spacing:.22em}
.brand b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand span{font:500 11px var(--mono);letter-spacing:.18em;color:var(--mute)}
.core{width:24px;height:24px;border-radius:50%;background:conic-gradient(var(--c),var(--v),var(--m),var(--c));position:relative;display:inline-block;vertical-align:middle;margin-right:10px;animation:spin 4s linear infinite}
.core::after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--bg)}
@keyframes spin{to{transform:rotate(360deg)}}
.progress{position:absolute;left:var(--pad);right:var(--pad);bottom:22px;height:4px;border-radius:4px;background:var(--cline);z-index:5;overflow:hidden}
.progress i{display:block;height:100%;background:var(--grad);transform-origin:left;animation:prog var(--total) linear both}
@keyframes prog{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.caption{position:absolute;left:var(--pad);right:var(--pad);bottom:40px;z-index:6;text-align:center}
/* Időzített felirat a felvétel más nyelvű képernyőihez (pl. magyar Google-képernyő angol videóban). */
.cues{position:absolute;left:var(--pad);right:var(--pad);bottom:40px;z-index:7;text-align:center;pointer-events:none}
body.vid .cues{bottom:236px;right:80px}
.cue{display:inline-block;max-width:100%;padding:8px 14px;border-radius:12px;background:rgba(255,214,10,.96);color:#111;
  font:700 18px/1.3 var(--sans);box-shadow:0 6px 24px rgba(0,0,0,.35)}
.cap{display:inline-block;padding:7px 12px;border-radius:10px;background:rgba(0,0,0,.62);color:#fff;font:500 16px/1.35 var(--sans);opacity:0}

.scene{position:absolute;inset:0;padding:96px var(--pad) 84px;display:flex;flex-direction:column;justify-content:safe center;gap:20px;opacity:0}
/* Álló videó: a LinkedIn, az Instagram és a TikTok az alsó negyedbe teszi a
   nevet és a poszt szövegét, jobbra pedig az ikonoszlopot. Ami oda esik, azt a
   néző nem látja — a felirat és a jelenet szövege ezért e fölött marad. */
body.vid .scene{padding:92px 80px 300px var(--pad);gap:16px}
body.vid .caption{bottom:236px;right:80px}
body.vid .phone{width:212px;height:392px;border-radius:34px;padding:9px}
body.vid .screen{border-radius:28px}
/* Egy hosszú szó se lógjon ki: törhet, és a build() a betűméretet is igazítja. */
.h,.sub,.url,.quote{overflow-wrap:anywhere}
.h .w{max-width:100%}
body.land .scene{flex-direction:row;align-items:center;gap:40px;padding:80px var(--pad) 70px}
body.land .scene .txt{flex:1 1 55%}
body.land .scene .vis{flex:0 0 auto}
body.square .scene{padding:74px var(--pad) 60px;gap:14px}
body.tall .scene{padding:82px var(--pad) 58px;gap:14px}
.txt{display:flex;flex-direction:column;gap:18px}
.vis{display:flex;justify-content:center}
@keyframes sIn{from{opacity:0;transform:translateY(40px) scale(.97);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
@keyframes sOut{from{opacity:1;transform:none;filter:none}to{opacity:0;transform:translateY(-40px) scale(1.02);filter:blur(8px)}}
.kicker{font:700 14px var(--mono);letter-spacing:.24em;text-transform:uppercase;color:var(--c)}
.h{font:700 var(--hs)/1.06 var(--sans);letter-spacing:-.01em}
.h.big{font-size:calc(var(--hs) * 1.35)}
.h .w{display:inline-block;margin-right:.24em}
.h .w.g{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
@keyframes pop{from{opacity:0;transform:translateY(30px) rotateX(70deg);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.sub{font:500 var(--ss)/1.35 var(--sans);color:var(--mute)}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes slide{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
.cards{display:grid;gap:12px}
.cardx{display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:18px;background:var(--card);border:1px solid var(--cline);font:500 var(--ls)/1.3 var(--sans)}
.cardx i{width:12px;height:12px;flex:none;border-radius:50%;background:var(--bad);box-shadow:0 0 12px var(--bad)}
.cardx.ok i{background:var(--ok);box-shadow:0 0 12px var(--ok)}
.cardx .num{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--grad);color:#05060d;font:700 16px var(--mono)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.col{padding:14px;border-radius:18px;background:var(--card);border:1px solid var(--cline)}
.col h4{font:700 12px var(--mono);letter-spacing:.18em;text-transform:uppercase;margin-bottom:10px;color:var(--bad)}
.col.after h4{color:var(--ok)}
.col p{font:500 calc(var(--ls) * .85)/1.3 var(--sans);padding:6px 0;border-top:1px solid var(--cline)}
.col.after{border-color:var(--ok);box-shadow:0 0 30px rgba(25,245,160,.15)}

.phone{position:relative;width:280px;height:540px;border-radius:42px;padding:11px;background:linear-gradient(145deg,#1b2238,#0a0e1a);
  box-shadow:0 0 0 2px var(--cline),0 30px 80px rgba(0,0,0,.5),0 0 60px var(--g1)}
body.square .phone{width:200px;height:370px;border-radius:32px;padding:8px}
/* 4:5: a telefon a cím alá férjen be, a fejléc és az alsó csík közé. */
body.tall .phone{width:210px;height:400px;border-radius:34px;padding:9px}
body.land .phone{width:220px;height:420px}
.screen{position:relative;width:100%;height:100%;border-radius:32px;overflow:hidden;background:#05070f}
body.square .screen{border-radius:24px}
body.tall .screen{border-radius:26px}
/* Keskeny telefonon a hívó neve/száma ne törjön két sorba. */
.cname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.tall .cname,body.square .cname{font-size:15px}
.screen img{position:absolute;left:0;top:0;width:100%}
.notch{position:absolute;top:9px;left:50%;width:80px;height:20px;margin-left:-40px;border-radius:12px;background:#000;z-index:3}
@keyframes phoneIn{from{opacity:0;transform:translateY(80px) scale(.9)}to{opacity:1;transform:none}}
.call{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:52px 14px 14px;gap:9px;color:#eef4ff;
  background:radial-gradient(240px 240px at 50% 22%,rgba(0,229,255,.25),transparent 70%),#05070f}
.avatar{position:relative;width:84px;height:84px;border-radius:50%;display:grid;place-items:center}
.avatar::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(#00e5ff,#8b5cff,#ff3df2,#00e5ff);animation:spin 3s linear infinite}
.avatar b{position:relative;width:72px;height:72px;border-radius:50%;background:#05070f;display:grid;place-items:center;font:700 22px var(--sans)}
.cname{font:700 18px var(--sans)}.cstate{font:500 12px var(--mono);color:#19f5a0;letter-spacing:.1em}
.sms{position:absolute;inset:0;padding:38px 11px 11px;background:#0b0f1a;color:#eef4ff;display:flex;flex-direction:column;gap:9px}
.sms .top{text-align:center;padding:4px 6px 9px;border-bottom:1px solid rgba(255,255,255,.08)}
.sms .top b{display:block;font:700 14px var(--sans)}.sms .top small{font:500 10px var(--mono);color:#94a3c4;letter-spacing:.12em}
.smsb{align-self:flex-start;max-width:90%;padding:9px 12px;border-radius:16px 16px 16px 5px;background:#1f2a40;font:500 13px/1.4 var(--sans);opacity:0}
.smsok{align-self:center;margin-top:4px;font:700 11px var(--mono);letter-spacing:.14em;color:#19f5a0;opacity:0}
.bub{max-width:90%;padding:8px 11px;border-radius:14px;font:500 13px/1.35 var(--sans);opacity:0}
.bub.ai{align-self:flex-start;background:linear-gradient(135deg,rgba(0,229,255,.22),rgba(139,92,255,.25));border:1px solid rgba(0,229,255,.35)}
.bub.me{align-self:flex-end;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12)}
.inbox{position:absolute;inset:0;padding:40px 10px 10px;background:#0b0f1a;color:#e8eefc;display:flex;flex-direction:column;gap:7px}
.inbox .top{font:700 13px var(--sans);padding:4px 6px 8px;border-bottom:1px solid rgba(255,255,255,.08)}
.mail{padding:8px 9px;border-radius:10px;background:rgba(255,255,255,.04);font:500 12px/1.3 var(--sans);opacity:0}
.mail em{display:inline-block;margin-top:5px;font:700 10px var(--mono);font-style:normal;padding:2px 7px;border-radius:999px;background:var(--grad);color:#05060d;opacity:0}
@keyframes tag{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{padding:16px 14px;border-radius:18px;background:var(--card);border:1px solid var(--cline);font:700 calc(var(--ls) * .9)/1.25 var(--sans);opacity:.25}
.tile small{display:block;font:500 11px var(--mono);letter-spacing:.14em;color:var(--mute);margin-bottom:6px}
@keyframes lit{from{opacity:.25;box-shadow:none}to{opacity:1;border-color:var(--c);box-shadow:0 0 26px var(--g1)}}
.bignum{font:700 calc(var(--hs) * 2.2)/1 var(--sans);background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.quote{font:700 calc(var(--hs) * .8)/1.2 var(--sans)}
.quote::before{content:"„";display:block;font-size:2.2em;line-height:.6;color:var(--c)}
.url{font:700 calc(var(--hs) * 1.25)/1 var(--sans);background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;word-break:break-all}
.pill{align-self:center;padding:14px 24px;border-radius:999px;background:var(--grad);color:#05060d;font:700 calc(var(--ss) * .9) var(--sans)}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.center{text-align:center;align-items:center}
/* saját kép és klip */
.bleed{position:absolute;inset:0;overflow:hidden;z-index:0}
.bleed img,.bleed video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  animation:kb var(--kbd,8s) ease-out both}
@keyframes kb{from{transform:scale(1.04)}to{transform:scale(1.13)}}
.bleed::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(0,0,0,.66) 0%,rgba(0,0,0,.28) 38%,rgba(0,0,0,.74) 100%)}
.scene>.txt,.scene>.vis{position:relative;z-index:1}
.onbleed{color:#fff;text-shadow:0 2px 18px rgba(0,0,0,.55)}
.onbleed .sub{color:rgba(255,255,255,.88)}
/* képernyőfelvétel a telefonban: kitölti a kijelzőt, a teteje látszik */
.rec{position:absolute;inset:0;background:#000}
.rec video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top}
.shot{border-radius:20px;overflow:hidden;border:1px solid var(--cline);background:var(--card);
  box-shadow:0 20px 60px rgba(0,0,0,.4);max-width:100%}
.shot img,.shot video{display:block;width:100%;height:auto}
body.land .shot{max-width:400px}
@keyframes shotIn{from{opacity:0;transform:translateY(40px) scale(.94)}to{opacity:1;transform:none}}
.grid2m{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2m .shot{border-radius:16px}
@keyframes tileIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
</style>
</head>
<body data-theme="neon">
<div id="stage">
  <div class="bg"></div><div class="grid"></div>
  <div class="brand"><div><i class="core"></i><b id="brandname">AXIMBRA</b></div><span id="tagline"></span></div>
  <div id="scenes"></div>
  <div class="caption" id="captions"></div>
  <div class="cues" id="cues"></div>
  <div class="progress"><i></i></div>
</div>
<script>
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const anim = (name, dur, delay, ease = "cubic-bezier(.2,.8,.2,1)") => `${name} ${dur}s ${ease} ${delay}s both`;

// A *csillaggal* jelölt szavak színátmenetesek.
function words(text, t0) {
  return String(text || "").split(/\s+/).filter(Boolean).map((w, i) => {
    const g = /\*/.test(w);
    return `<span class="w ${g ? "g" : ""}" style="animation:${anim("pop", .55, t0 + .12 * i)}">${esc(w.replace(/\*/g, ""))}</span>`;
  }).join("");
}
const rise = (cls, html, t) => html ? `<div class="${cls}" style="animation:${anim("rise", .6, t)}">${esc(html)}</div>` : "";

function head(s, t0, big) {
  return `${s.kicker ? `<div class="kicker" style="animation:${anim("rise", .5, t0)}">${esc(s.kicker)}</div>` : ""}
    ${s.headline ? `<div class="h ${big ? "big" : ""}">${words(s.headline, t0 + .15)}</div>` : ""}`;
}
function phone(inner, t0) {
  return `<div class="phone" style="animation:${anim("phoneIn", .8, t0 + .3)}"><div class="screen"><div class="notch"></div>${inner}</div></div>`;
}

function scene(s, t0, shots, dims, lib) {
  const d = s.seconds, L = s.lines || [];
  const per = (n) => Math.max(.35, Math.min(.9, (d - 2) / Math.max(1, n)));
  switch (s.kind) {
    case "problem": case "benefit":
      return {txt: head(s, t0) + `<div class="cards">${L.map((l, i) =>
        `<div class="cardx ${s.kind === "benefit" ? "ok" : ""}" style="animation:${anim("slide", .55, t0 + .7 + per(L.length) * i)}"><i></i>${esc(l)}</div>`).join("")}</div>` + rise("sub", s.sub, t0 + .9 + per(L.length) * L.length)};
    case "steps":
      return {txt: head(s, t0) + `<div class="cards">${L.map((l, i) =>
        `<div class="cardx" style="animation:${anim("slide", .55, t0 + .7 + per(L.length) * i)}"><span class="num">${i + 1}</span>${esc(l)}</div>`).join("")}</div>` + rise("sub", s.sub, t0 + 1 + per(L.length) * L.length)};
    case "compare": {
      const R = s.lines2 || [];
      const col = (cls, title, arr, t) => `<div class="col ${cls}" style="animation:${anim("rise", .6, t)}"><h4>${esc(title)}</h4>${arr.map((l) => `<p>${esc(l)}</p>`).join("")}</div>`;
      return {txt: head(s, t0) + `<div class="cols">${col("", s.left_title || "Most", L, t0 + .7)}${col("after", s.right_title || "Agenttel", R, t0 + .7 + d * .3)}</div>` + rise("sub", s.sub, t0 + d * .55)};
    }
    case "site": {
      const shot = shots[s.shot || 0] || shots[0];
      if (!shot) return {txt: head(s, t0, true) + rise("sub", s.sub, t0 + .6)};
      const vis = dims.visH, dist = Math.max(0, Math.min(shot.height - vis, 2400));
      const id = "sc" + Math.round(t0 * 100);
      return {txt: head(s, t0) + rise("sub", s.sub, t0 + .6),
        vis: phone(`<img src="${shot.src}" style="animation:${id} ${Math.max(1, d - 1.4)}s ease-in-out ${t0 + 1}s both"><style>@keyframes ${id}{from{transform:translateY(0)}to{transform:translateY(-${dist}px)}}</style>`, t0)};
    }
    case "call":
      return {txt: head(s, t0) + rise("sub", s.sub, t0 + .6),
        vis: phone(`<div class="call"><div class="avatar"><b>AI</b></div><div class="cname">${esc(s.caller || "AXIMBRA AI")}</div>
          <div class="cstate">● ${esc(s.status || "HÍVÁS FOLYAMATBAN")}</div>
          ${L.map((l, i) => `<div class="bub ${i % 2 ? "me" : "ai"}" style="animation:${anim("rise", .45, t0 + 1.1 + i * per(L.length) * 1.4)}">${esc(l)}</div>`).join("")}</div>`, t0)};
    case "sms":
      return {txt: head(s, t0) + rise("sub", s.sub, t0 + .6),
        vis: phone(`<div class="sms"><div class="top"><b>${esc(s.caller || "SMS")}</b><small>ÜZENET · MOST</small></div>
          ${L.map((l, i) => `<div class="smsb" style="animation:${anim("rise", .45, t0 + 1.1 + i * per(L.length) * 1.2)}">${esc(l)}</div>`).join("")}
          <div class="smsok" style="animation:${anim("rise", .45, t0 + 1.5 + L.length * per(L.length) * 1.2)}">✓ KÉZBESÍTVE</div></div>`, t0)};
    case "inbox":
      return {txt: head(s, t0) + rise("sub", s.sub, t0 + .6),
        vis: phone(`<div class="inbox"><div class="top">${esc(s.app || "Beérkezett levelek")}</div>${L.map((l, i) => {
          const [subj, tagtxt] = String(l).split("|");
          const t = t0 + .9 + i * .35;
          return `<div class="mail" style="animation:${anim("rise", .4, t)}">${esc(subj)}${tagtxt ? `<br><em style="animation:${anim("tag", .35, t + 1.2 + i * .25)}">${esc(tagtxt.trim())}</em>` : ""}</div>`;
        }).join("")}</div>`, t0)};
    case "photo": {
      const m = lib[s.media];
      if (!m) return {txt: head(s, t0, true) + rise("sub", s.sub, t0 + .7)};
      if (s.layout === "side") {
        return {txt: head(s, t0) + rise("sub", s.sub, t0 + .6),
          vis: `<div class="shot" style="animation:${anim("shotIn", .8, t0 + .3)}"><img src="${esc(m.src)}" alt=""></div>`};
      }
      return {bleed: `<div class="bleed" style="--kbd:${d + 1}s"><img src="${esc(m.src)}" alt=""></div>`,
        onbleed: true, txt: head(s, t0, true) + rise("sub", s.sub, t0 + .7)};
    }
    case "clip": {
      const m = lib[s.media];
      if (!m) return {txt: head(s, t0, true) + rise("sub", s.sub, t0 + .7)};
      // A felvétel egy szakasza: "from"-tól, "speed" sebességgel (a seek számolja).
      const cue = s.cues && s.cues.length ? ` data-cue="${s._i}" data-end="${t0 - .1 + d}"` : "";
      const v = `<video src="${esc(m.src)}"${cue} data-start="${t0 - .1}" data-from="${+s.from || 0}" data-speed="${+s.speed || 1}" muted playsinline preload="auto" style="animation:none"></video>`;
      if (s.layout === "phone")
        return {txt: head(s, t0) + rise("sub", s.sub, t0 + .6), vis: phone(`<div class="rec">${v}</div>`, t0)};
      return {bleed: `<div class="bleed">${v}</div>`, onbleed: true, txt: head(s, t0, true) + rise("sub", s.sub, t0 + .7)};
    }
    case "gallery": {
      const ids = (s.medias || []).filter((x) => lib[x]).slice(0, 4);
      if (!ids.length) return {txt: head(s, t0, true) + rise("sub", s.sub, t0 + .7)};
      return {txt: head(s, t0) + `<div class="grid2m">${ids.map((id, i) =>
        `<div class="shot" style="animation:${anim("tileIn", .5, t0 + .8 + .3 * i)}"><img src="${esc(lib[id].src)}" alt=""></div>`).join("")}</div>`
        + rise("sub", s.sub, t0 + 1.2 + ids.length * .3)};
    }
    case "agents":
      return {txt: head(s, t0) + `<div class="tiles">${L.map((l, i) =>
        `<div class="tile" style="animation:${anim("lit", .5, t0 + .8 + per(L.length) * .6 * i, "ease")}"><small>${esc(s.tile_label || "AGENT")} ${String(i + 1).padStart(2, "0")}</small>${esc(l)}</div>`).join("")}</div>` + rise("sub", s.sub, t0 + 1.2 + L.length * .3)};
    case "number":
      return {txt: `${s.kicker ? `<div class="kicker">${esc(s.kicker)}</div>` : ""}<div class="bignum" style="animation:${anim("pop", .8, t0 + .2)}">${esc(s.headline)}</div>` + rise("sub", s.sub, t0 + .8)};
    case "quote":
      return {txt: `<div class="quote" style="animation:${anim("rise", .7, t0 + .2)}">${esc(s.headline)}</div>` + rise("sub", s.sub, t0 + 1)};
    case "cta":
      return {center: true, txt: `${s.kicker ? `<div class="kicker" style="animation:${anim("rise", .5, t0)}">${esc(s.kicker)}</div>` : ""}
        <div class="h" style="text-align:center">${words(s.headline, t0 + .15)}</div>
        <div class="url" style="animation:${anim("pop", .8, t0 + .7)}">${esc(s.url || "aximbra.hu")}</div>
        ${rise("sub", s.sub, t0 + 1.1)}
        ${s.button ? `<div class="pill" style="animation:${anim("rise", .6, t0 + 1.4)},pulse 1.6s ease-in-out ${t0 + 2}s infinite">${esc(s.button)}</div>` : ""}`};
    case "statement":
      return {center: !!s.center, txt: head(s, t0, true) + rise("sub", s.sub, t0 + .7)};
    default: // hook
      return {txt: head(s, t0, true) + rise("sub", s.sub, t0 + .7)};
  }
}

// cfg: {scenes, tagline, brand, theme, aspect, shots: [{src,height}], captions: bool,
//       stills: bool (állókép/körhinta: se csík, se felirat)}; visszaadja a hosszt (s).
window.build = (cfg) => {
  document.body.dataset.theme = cfg.theme || "neon";
  const shape = cfg.aspect === "1:1" ? "square" : cfg.aspect === "16:9" ? "land"
    : cfg.aspect === "4:5" ? "tall" : "";
  const vid = !shape && !cfg.stills;
  document.body.className = [shape, cfg.stills ? "stills" : "", vid ? "vid" : ""].filter(Boolean).join(" ");
  const visH = cfg.aspect === "1:1" ? 354 : cfg.aspect === "16:9" ? 398
    : cfg.aspect === "4:5" ? 382 : vid ? 374 : 518;
  let t = 0, caps = "", cueHtml = "";
  CUES = {};
  const html = cfg.scenes.map((s, i) => {
    const t0 = t, last = i === cfg.scenes.length - 1;
    s._i = i;
    if (s.kind === "clip" && s.cues && s.cues.length) {
      CUES[i] = s.cues;
      cueHtml += `<span class="cue" id="cue${i}" style="display:none"></span>`;
    }
    t += s.seconds;
    const outs = (last || cfg.stills) ? "" : `,sOut .45s ease-in ${t - .45}s forwards`;
    const r = scene(s, t0 + .1, cfg.shots || [], {visH}, cfg.lib || {});
    if (cfg.captions && !cfg.stills && s.voice) caps += `<span class="cap" style="position:absolute;left:0;right:0;bottom:0;margin:0 auto;width:fit-content;max-width:100%;animation:rise .3s ease ${t0 + .2}s both${last ? "" : `,sOut .3s ease ${t - .35}s forwards`}">${esc(s.voice)}</span>`;
    return `<section class="scene ${r.center ? "center" : ""} ${r.onbleed ? "onbleed" : ""}" style="animation:sIn .6s cubic-bezier(.2,.8,.2,1) ${t0}s both${outs}">
      ${r.bleed || ""}<div class="txt ${r.center ? "center" : ""}">${r.txt}</div>${r.vis ? `<div class="vis">${r.vis}</div>` : ""}</section>`;
  }).join("");
  document.documentElement.style.setProperty("--total", t + "s");
  document.getElementById("tagline").textContent = cfg.tagline || "";
  document.getElementById("brandname").textContent = cfg.brand || "AXIMBRA";
  document.getElementById("scenes").innerHTML = html;
  document.getElementById("captions").innerHTML = caps;
  document.getElementById("cues").innerHTML = cueHtml;
  fitText();
  ENDS = cfg.scenes.reduce((acc, s) => (acc.push((acc[acc.length - 1] || 0) + s.seconds), acc), []);
  return t;
};
// Ami nem fér ki, az kisebb betűvel jelenik meg, nem levágva: egy hosszú szó
// vagy cím addig csökken, amíg a sorába és legfeljebb három sorba be nem fér.
function fitText() {
  for (const el of document.querySelectorAll("#scenes .h, #scenes .url, #scenes .bignum, #scenes .quote")) {
    let size = parseFloat(getComputedStyle(el).fontSize);
    const lh = () => parseFloat(getComputedStyle(el).lineHeight) || size * 1.1;
    for (let i = 0; i < 30 && size > 18 && (el.scrollWidth > el.clientWidth + 1 || el.scrollHeight > lh() * 3 + 2); i++) {
      size -= 2;
      el.style.fontSize = size + "px";
    }
  }
}
// Álló dia: mivel nincs kimenő halványítás, a korábbi jelenetek ott maradnának
// egymáson. Ezért egyszerre csak a kért diát mutatjuk, a végállapotában.
let ENDS = [], CUES = {};
window.slide = (i) => {
  const secs = [...document.querySelectorAll("#scenes .scene")];
  secs.forEach((el, k) => { el.style.display = k === i ? "" : "none"; });
  return seek(Math.max(0, (ENDS[i] || 0) - 0.05) * 1000);
};
// A képkockákat pontosan léptetjük: az animációkat időre állítjuk, a
// klipeket pedig a saját kezdetükhöz képest tekerjük, és megvárjuk őket.
window.seek = (ms) => {
  for (const a of document.getAnimations()) { a.pause(); a.currentTime = ms; }
  const vids = [...document.querySelectorAll("video[data-start]")];
  if (!vids.length) return;
  return Promise.all(vids.map((v) => new Promise((done) => {
    const len = isFinite(v.duration) ? v.duration : 0;
    const local = Math.max(0, ms / 1000 - (+v.dataset.start || 0));
    const want = Math.max(0, Math.min(Math.max(0, len - 0.05), (+v.dataset.from || 0) + local * (+v.dataset.speed || 1)));
    if (v.dataset.cue) {
      // A felirat csak a jelenet alatt, és csak a felvétel adott szakaszán látszik.
      const box = document.getElementById("cue" + v.dataset.cue), now = ms / 1000;
      const on = now >= (+v.dataset.start || 0) && now < (+v.dataset.end || 0);
      const c = on && (CUES[v.dataset.cue] || []).find((x) => want >= x.from && want < x.to);
      if (box) { box.textContent = c ? c.text : ""; box.style.display = c ? "" : "none"; }
    }
    if (!len || Math.abs(v.currentTime - want) < 0.005) return done();
    const fin = () => { v.removeEventListener("seeked", fin); clearTimeout(t); done(); };
    const t = setTimeout(fin, 250);
    v.addEventListener("seeked", fin);
    v.currentTime = want;
  })));
};
</script>
</body>
</html>
