<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@500;700&display=block">
<style>
/* Egy 9:16-os videó jelenetei. Minden mozgás CSS-animáció, a renderelő a
   Web Animations API-val lépteti őket képkockánként, így a kimenet
   determinisztikus: ugyanaz a forgatókönyv mindig ugyanazt a videót adja. */
:root{--c:#00e5ff;--v:#8b5cff;--m:#ff3df2;--ok:#19f5a0;--bad:#ff4d6d;--ink:#eef4ff;--mute:#94a3c4;
  --grad:linear-gradient(120deg,#00e5ff,#8b5cff 55%,#ff3df2);
  --sans:"Space Grotesk","DejaVu Sans",Arial,sans-serif;--mono:"JetBrains Mono","DejaVu Sans Mono",monospace}
*{box-sizing:border-box;margin:0}
html,body{width:540px;height:960px;overflow:hidden;background:#03040a;color:var(--ink);font-family:var(--sans)}
#stage{position:relative;width:540px;height:960px;overflow:hidden}
.bg{position:absolute;inset:-40px;background:
  radial-gradient(420px 420px at 10% 0%,rgba(0,229,255,.28),transparent 70%),
  radial-gradient(460px 460px at 100% 45%,rgba(139,92,255,.30),transparent 70%),
  radial-gradient(420px 420px at 30% 110%,rgba(255,61,242,.18),transparent 70%);animation:glow var(--total) linear both}
@keyframes glow{to{transform:translate(-30px,20px) scale(1.08);filter:hue-rotate(30deg)}}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(120,180,255,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(120,180,255,.09) 1px,transparent 1px);
  background-size:36px 36px;mask-image:linear-gradient(180deg,transparent,#000 30%,#000 70%,transparent);animation:gridmove var(--total) linear both}
@keyframes gridmove{to{background-position:0 360px}}
.brand{position:absolute;top:34px;left:32px;right:32px;display:flex;justify-content:space-between;align-items:center;z-index:5;
  font:700 15px var(--sans);letter-spacing:.22em}
.brand b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand span{font:500 11px var(--mono);letter-spacing:.18em;color:var(--mute)}
.core{width:26px;height:26px;border-radius:50%;background:conic-gradient(#00e5ff,#8b5cff,#ff3df2,#00e5ff);position:relative;display:inline-block;vertical-align:middle;margin-right:10px;
  box-shadow:0 0 16px rgba(0,229,255,.7);animation:spin 4s linear infinite}
.core::after{content:"";position:absolute;inset:5px;border-radius:50%;background:#03040a}
@keyframes spin{to{transform:rotate(360deg)}}
.progress{position:absolute;left:32px;right:32px;bottom:30px;height:4px;border-radius:4px;background:rgba(255,255,255,.08);z-index:5;overflow:hidden}
.progress i{display:block;height:100%;background:var(--grad);transform-origin:left;animation:prog var(--total) linear both}
@keyframes prog{from{transform:scaleX(0)}to{transform:scaleX(1)}}

.scene{position:absolute;inset:0;padding:120px 36px 80px;display:flex;flex-direction:column;justify-content:center;gap:22px;opacity:0}
@keyframes sIn{from{opacity:0;transform:translateY(40px) scale(.97);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
@keyframes sOut{from{opacity:1;transform:none;filter:none}to{opacity:0;transform:translateY(-40px) scale(1.02);filter:blur(8px)}}
.kicker{font:700 14px var(--mono);letter-spacing:.24em;text-transform:uppercase;color:var(--c);text-shadow:0 0 14px rgba(0,229,255,.6)}
.h{font:700 50px/1.06 var(--sans);letter-spacing:-.01em}
.h .w{display:inline-block;margin-right:.24em}
.h .w.g{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(139,92,255,.55))}
@keyframes pop{from{opacity:0;transform:translateY(30px) rotateX(70deg);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.sub{font:500 22px/1.35 var(--sans);color:#c9d6f2}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.cards{display:grid;gap:12px}
.cardx{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:18px;background:rgba(16,22,40,.72);border:1px solid rgba(120,180,255,.18);
  font:500 21px/1.3 var(--sans);box-shadow:0 10px 30px rgba(0,0,0,.35)}
.cardx i{width:12px;height:12px;flex:none;border-radius:50%;background:var(--bad);box-shadow:0 0 12px var(--bad)}
.cardx.ok i{background:var(--ok);box-shadow:0 0 12px var(--ok)}
@keyframes slide{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}

.phone{position:relative;align-self:center;width:300px;height:560px;border-radius:44px;padding:12px;background:linear-gradient(145deg,#1b2238,#0a0e1a);
  box-shadow:0 0 0 2px rgba(120,180,255,.25),0 30px 80px rgba(0,0,0,.6),0 0 60px rgba(0,229,255,.25)}
.screen{position:relative;width:100%;height:100%;border-radius:34px;overflow:hidden;background:#05070f}
.screen img{position:absolute;left:0;top:0;width:100%}
.notch{position:absolute;top:10px;left:50%;width:90px;height:22px;margin-left:-45px;border-radius:12px;background:#000;z-index:3}
@keyframes phoneIn{from{opacity:0;transform:translateY(80px) rotateX(25deg) scale(.9)}to{opacity:1;transform:none}}

.call{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:60px 16px 16px;gap:10px;
  background:radial-gradient(260px 260px at 50% 25%,rgba(0,229,255,.25),transparent 70%),#05070f}
.avatar{position:relative;width:96px;height:96px;border-radius:50%;display:grid;place-items:center}
.avatar::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(#00e5ff,#8b5cff,#ff3df2,#00e5ff);animation:spin 3s linear infinite}
.avatar b{position:relative;width:84px;height:84px;border-radius:50%;background:#05070f;display:grid;place-items:center;font:700 26px var(--sans)}
.ringwave{position:absolute;top:60px;left:50%;width:96px;height:96px;margin-left:-48px;border-radius:50%;border:2px solid var(--c);animation:wave 1.4s ease-out infinite}
@keyframes wave{from{transform:scale(1);opacity:.9}to{transform:scale(2.2);opacity:0}}
.cname{font:700 20px var(--sans)}.cstate{font:500 13px var(--mono);color:var(--ok);letter-spacing:.1em}
.bub{max-width:88%;padding:9px 12px;border-radius:14px;font:500 14px/1.35 var(--sans);opacity:0}
.bub.ai{align-self:flex-start;background:linear-gradient(135deg,rgba(0,229,255,.22),rgba(139,92,255,.25));border:1px solid rgba(0,229,255,.35)}
.bub.me{align-self:flex-end;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12)}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{padding:18px 14px;border-radius:18px;background:rgba(16,22,40,.72);border:1px solid rgba(120,180,255,.16);font:700 18px/1.25 var(--sans);opacity:.25}
.tile small{display:block;font:500 11px var(--mono);letter-spacing:.14em;color:var(--mute);margin-bottom:6px}
@keyframes lit{from{opacity:.25;border-color:rgba(120,180,255,.16);box-shadow:none}to{opacity:1;border-color:rgba(0,229,255,.7);box-shadow:0 0 26px rgba(0,229,255,.35)}}

.url{font:700 64px/1 var(--sans);text-align:center;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 26px rgba(0,229,255,.55))}
.pill{align-self:center;padding:16px 26px;border-radius:999px;background:var(--grad);color:#05060d;font:700 20px var(--sans);box-shadow:0 0 40px rgba(139,92,255,.6)}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.center{text-align:center;align-items:center}
</style>
</head>
<body>
<div id="stage">
  <div class="bg"></div><div class="grid"></div>
  <div class="brand"><div><i class="core"></i><b>AXIMBRA</b></div><span id="tagline"></span></div>
  <div id="scenes"></div>
  <div class="progress"><i></i></div>
</div>
<script>
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const anim = (name, dur, delay, extra = "") => `${name} ${dur}s ${extra || "cubic-bezier(.2,.8,.2,1)"} ${delay}s both`;

// A kiemelt szavak (a címben *így* jelölve) színátmenetesek.
function words(text, t0) {
  return String(text || "").split(/\s+/).filter(Boolean).map((w, i) => {
    const g = /^\*.*\*$/.test(w) || /^\*/.test(w) || /\*$/.test(w);
    return `<span class="w ${g ? "g" : ""}" style="animation:${anim("pop", .55, t0 + .12 * i)}">${esc(w.replace(/\*/g, ""))}</span>`;
  }).join("");
}

function sceneHTML(s, t0, shot) {
  const d = s.seconds, L = s.lines || [];
  const head = `${s.kicker ? `<div class="kicker" style="animation:${anim("rise", .5, t0)}">${esc(s.kicker)}</div>` : ""}
    <div class="h">${words(s.headline, t0 + .15)}</div>`;
  const sub = s.sub ? `<div class="sub" style="animation:${anim("rise", .6, t0 + .6)}">${esc(s.sub)}</div>` : "";
  switch (s.kind) {
    case "problem":
    case "benefit":
      return head + `<div class="cards">${L.map((l, i) =>
        `<div class="cardx ${s.kind === "benefit" ? "ok" : ""}" style="animation:${anim("slide", .55, t0 + .7 + .45 * i)}"><i></i>${esc(l)}</div>`).join("")}</div>` + sub;
    case "site": {
      const h = shot ? shot.height : 0, vis = 536, dist = Math.max(0, Math.min(h - vis, 2600));
      return head + `<div class="phone" style="animation:${anim("phoneIn", .8, t0 + .3)}"><div class="screen"><div class="notch"></div>
        ${shot ? `<img src="${shot.src}" style="animation:scroll${t0 | 0} ${Math.max(1, d - 1.4)}s ease-in-out ${t0 + 1}s both">
        <style>@keyframes scroll${t0 | 0}{from{transform:translateY(0)}to{transform:translateY(-${dist}px)}}</style>` : ""}</div></div>` + sub;
    }
    case "call":
      return head + `<div class="phone" style="animation:${anim("phoneIn", .8, t0 + .3)}"><div class="screen"><div class="notch"></div>
        <div class="call"><div class="ringwave"></div><div class="avatar"><b>AI</b></div><div class="cname">AXIMBRA AI</div>
        <div class="cstate">● ${esc(s.status || "HÍVÁS FOLYAMATBAN")}</div>
        ${L.map((l, i) => `<div class="bub ${i % 2 ? "me" : "ai"}" style="animation:${anim("rise", .45, t0 + 1.1 + i * Math.max(.8, (d - 2) / Math.max(1, L.length)))}">${esc(l)}</div>`).join("")}
        </div></div></div>` + sub;
    case "agents":
      return head + `<div class="tiles">${L.map((l, i) =>
        `<div class="tile" style="animation:${anim("lit", .5, t0 + .8 + .35 * i, "ease")}"><small>AGENT ${String(i + 1).padStart(2, "0")}</small>${esc(l)}</div>`).join("")}</div>` + sub;
    case "cta":
      return `${s.kicker ? `<div class="kicker center" style="animation:${anim("rise", .5, t0)}">${esc(s.kicker)}</div>` : ""}
        <div class="h center" style="text-align:center">${words(s.headline, t0 + .15)}</div>
        <div class="url" style="animation:${anim("pop", .8, t0 + .7)}">${esc(s.url || "aximbra.hu")}</div>
        ${s.sub ? `<div class="sub center" style="text-align:center;animation:${anim("rise", .6, t0 + 1.1)}">${esc(s.sub)}</div>` : ""}
        ${s.button ? `<div class="pill" style="animation:${anim("rise", .6, t0 + 1.4)},pulse 1.6s ease-in-out ${t0 + 2}s infinite">${esc(s.button)}</div>` : ""}`;
    default: // hook
      return head + sub;
  }
}

// cfg: {scenes: [...], tagline, shot: {src, height}}; visszaadja a teljes hosszt (s).
window.build = (cfg) => {
  let t = 0;
  const html = cfg.scenes.map((s, i) => {
    const t0 = t, last = i === cfg.scenes.length - 1;
    t += s.seconds;
    const outs = last ? "" : `,sOut .45s ease-in ${t - .45}s forwards`;
    return `<section class="scene ${s.kind === "cta" ? "center" : ""}" style="animation:sIn .6s cubic-bezier(.2,.8,.2,1) ${t0}s both${outs}">${sceneHTML(s, t0 + .1, cfg.shot)}</section>`;
  }).join("");
  document.documentElement.style.setProperty("--total", t + "s");
  document.getElementById("tagline").textContent = cfg.tagline || "";
  document.getElementById("scenes").innerHTML = html;
  return t;
};

window.seek = (ms) => { for (const a of document.getAnimations()) { a.pause(); a.currentTime = ms; } };
</script>
</body>
</html>
