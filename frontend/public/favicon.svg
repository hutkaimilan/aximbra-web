  </defs>
  <rect width="64" height="64" rx="14" fill="#04040C"/>
  <path d="M32 13 L47 51 H39.4 L36.2 42.4 H27.8 L24.6 51 H17 Z M30.1 35.6 h3.8 L32 30.2 Z"
